# This workflow runs tests and then publishes the package to npmjs.com via OIDC trusted publishing when a release is created
# For more information see: https://docs.npmjs.com/trusted-publishers

name: Node.js Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # job-level permissions fully replace workflow-level ones, so OIDC must be granted here
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24  # bundles npm 11.x; Node 22 bundles npm 10.x which lacks trusted publishing (requires npm >= 11.5.1)
          registry-url: https://registry.npmjs.org
          package-manager-cache: false  # never use caching in release builds
      - run: npm i
      - run: npm run build
      - run: cd dist && npm publish
